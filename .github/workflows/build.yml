name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: zsh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Function-Keys-Apple-Silicon
          path: build/Function-Keys-Apple-Silicon.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Function-Keys-Apple-Silicon
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/Function-Keys-Apple-Silicon.zip --prerelease --title "Function Keys $TAG" --notes "Apple Silicon macOS build. Ad-hoc signed, not notarized. Keyboard switching and cross-Mac compatibility need manual verification."
